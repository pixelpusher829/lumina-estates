<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta
			name="description"
			content="Lumina Estates — discover premium homes, apartments and villas for sale and rent."
		/>
		<meta name="theme-color" content="#4f46e5" />
		<title>Lumina Estates</title>
		<meta property="og:title" content="Lumina Estates" />
		<meta property="og:description" content="Discover premium homes, apartments and villas for sale and rent." />
		<meta property="og:type" content="website" />
		<meta property="og:url" content="https://lumina-estates.vercel.app/" />
		<meta property="og:image" content="https://lumina-estates.vercel.app/og-image.jpg" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:image:alt" content="Lumina Estates home page" />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:image" content="https://lumina-estates.vercel.app/og-image.jpg" />
		<script>
			// Apply the saved/system theme before first paint to avoid a flash.
			(() => {
				let theme = "system";
				try {
					theme = localStorage.getItem("lumina_theme") || "system";
				} catch {}
				const dark =
					theme === "dark" ||
					(theme === "system" &&
						matchMedia("(prefers-color-scheme: dark)").matches);
				document.documentElement.classList.toggle("dark", dark);
			})();
		</script>
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
			rel="stylesheet"
		/>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/app/index.tsx"></script>
	</body>
</html>
